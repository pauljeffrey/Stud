services:
  redis:
    image: redis:7-alpine
    container_name: stud-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    # Cap Redis so it cannot compete with the host for every core.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - stud-network

  backend:
    build:
      context: .
      dockerfile: dockerfile
    container_name: stud-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      # Override .env so start.sh picks start_server_dev() → uvicorn --reload
      - GUNICORN_WORKERS=
      # Local dev: keep thread/connection pools small (production uses 512 in .env).
      - DB_THREAD_POOL_SIZE=8
      - REDIS_MAX_CONNECTIONS=8
    # Limit backend CPU — raise cpus (e.g. "4.0") before a heavy load test.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 512M
    volumes:
      # Live-mount source code — uvicorn --reload watches /app for changes
      - .:/app
      # Prevent the container's compiled cache from being overwritten by the mount
      - /app/__pycache__
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    dns_search: []
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Docker Compose Watch: triggers a full image rebuild when dependencies change.
    # Python file changes are handled by uvicorn --reload inside the container.
    develop:
      watch:
        - action: rebuild
          path: ./requirements.txt
        - action: rebuild
          path: ./dockerfile
    networks:
      - stud-network

networks:
  stud-network:
    driver: bridge
