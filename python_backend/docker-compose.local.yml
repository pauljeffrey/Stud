services:
  redis:
    image: redis:7-alpine
    container_name: stud-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - stud-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stud-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      # Production: uncomment and tune (each Uvicorn worker gets its own thread pool + Redis pool).
      # - GUNICORN_WORKERS=4
      # - DB_THREAD_POOL_SIZE=512
      # - REDIS_MAX_CONNECTIONS=200
    volumes:
      # Mount code for hot-reload (development)
      - .:/app
      # Exclude node_modules and other large dirs
      - /app/__pycache__
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    dns_search: []
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - stud-network

networks:
  stud-network:
    driver: bridge
