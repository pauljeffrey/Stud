services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stud-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount code for hot-reload (development)
      - .:/app
      # Exclude node_modules and other large dirs
      - /app/__pycache__
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - stud-network

networks:
  stud-network:
    driver: bridge
