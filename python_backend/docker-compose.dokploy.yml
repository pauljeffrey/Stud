# Dokploy / Traefik — same pattern as ottobiz: backend on dokploy-network, exposed :8000.
#
# Dokploy env (project / .env), required minimum:
#   SECRET_KEY, SUPABASE_URL, SERVICE_ROLE_KEY, GOOGLE_API_KEY or OPENAI_API_KEY (per app)
#   REDIS_URL=redis://...
#   MEDIQUEST_DOMAIN=mediquest-backend-kukljh-703756-212-47-72-183.sslip.io   # Host only, no scheme
#
# HTTPS + Browser API clients:
#   PRODUCTION=1
#   ALLOWED_ORIGINS=https://your-frontend... ,https://${MEDIQUEST_DOMAIN}
#
# Compose file to use:
#   docker compose -f docker-compose.dokploy.yml up -d --build
#
services:
  backend:
    image: mediquest-backend:latest
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      GUNICORN_WORKERS: "4"
      PRODUCTION: "${PRODUCTION:-1}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - default
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - "traefik.http.routers.mediquest-backend-web.rule=Host(`${MEDIQUEST_DOMAIN}`)"
      - traefik.http.routers.mediquest-backend-web.entrypoints=web
      - traefik.http.services.mediquest-backend-web.loadbalancer.server.port=8000
      - traefik.http.routers.mediquest-backend-web.service=mediquest-backend-web
      - traefik.http.routers.mediquest-backend-web.middlewares=redirect-to-https@file
      - "traefik.http.routers.mediquest-backend-websecure.rule=Host(`${MEDIQUEST_DOMAIN}`)"
      - traefik.http.routers.mediquest-backend-websecure.entrypoints=websecure
      - traefik.http.services.mediquest-backend-websecure.loadbalancer.server.port=8000
      - traefik.http.routers.mediquest-backend-websecure.service=mediquest-backend-websecure
      - traefik.http.routers.mediquest-backend-websecure.tls.certresolver=letsencrypt

networks:
  dokploy-network:
    external: true
